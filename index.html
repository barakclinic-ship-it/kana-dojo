<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kana Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@700&family=Varela+Round&display=swap">
<style>
/* Layout: one-screen phone app, stacked screens; top bar / stage / action zone. Single dark look by choice. */
:root{
  --bg:#222a39; --surface:#323c50; --surface-2:#3c475d; --line:#4a566f;
  --fg:#eef1f6; --muted:#9aa4b8; --guide:#6d7790; --guide-soft:#4b5569;
  --blue:#5aa9e6; --blue-soft:#8cc7f2; --orange:#f5a623; --green:#33c27a; --red:#ef4b5c;
  --f-ui:"Varela Round","Rubik","Arial Hebrew",system-ui,sans-serif;
  --f-sign:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue-soft);outline-offset:3px}
.app{height:100%;max-width:520px;margin:0 auto;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:absolute;inset:0;padding:inherit;display:flex;flex-direction:column}
.kana{font-family:var(--f-kana);direction:ltr}
.roma{direction:ltr;letter-spacing:.02em}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding-block:14px 8px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon-btn svg{width:28px;height:28px;fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--surface)}
.bar h1{font-size:20px;font-weight:400;flex:1;margin:0}
.progress{flex:1;height:18px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .35s ease}

/* home */
.home{justify-content:center;gap:28px;align-items:center}
.brand{text-align:center;display:grid;gap:4px}
.brand b{font-size:26px;font-weight:400}
.brand span{color:var(--muted);font-size:14px}
.big-choice{display:grid;justify-items:center;gap:8px}
.disc{width:min(52vw,230px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .15s}
.disc:active{transform:scale(.96)}
.disc.h{background:var(--blue)} .disc.k{background:var(--orange)}
.disc svg{width:66%;height:66%}
.big-choice strong{font-size:20px;font-weight:400}
.big-choice small{color:var(--muted);font-size:14px}
.home-top{position:absolute;top:14px;inset-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center}
.home-top .sp{flex:1}
.icon-btn.inst svg{stroke:var(--blue-soft)}
.icon-btn.inst{background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.35)}
.ios-steps{color:var(--muted);font-size:15px;line-height:1.9;margin:0}
.ios-steps b{color:var(--fg);font-weight:400}

/* lesson list */
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:170px;margin-inline:-6px;padding-inline:6px}
.row{display:flex;align-items:center;gap:16px;padding:8px 4px;border-radius:16px;text-align:start;width:100%}
.row:active{background:var(--surface)}
.row .badge{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:40px;color:#fff;background:var(--blue);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.row.k .badge{background:var(--orange)}
.row.locked .badge{background:#7d8494;box-shadow:none}
.row .meta{display:grid;gap:2px;min-width:0}
.row .meta b{font-size:19px;font-weight:400}
.row .meta .chars{font-size:19px;color:var(--muted);letter-spacing:.12em}
.row .meta em{font-style:normal;font-size:14px;color:var(--muted)}
.row.ready .meta em{color:var(--green)}
.row.locked{opacity:.75}
.dock{position:absolute;inset:auto 0 0 0;padding:28px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:grid;gap:12px}

.btn{height:58px;border-radius:18px;font-size:20px;color:#fff;width:100%;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn.orange{background:var(--orange)} .btn.blue{background:var(--blue)} .btn.green{background:var(--green)}
.btn.light{background:var(--blue-soft);color:#1d3550}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* session */
.prompt{color:var(--muted);font-size:21px;padding-block:14px 0;margin:0;font-weight:400}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.glyph{width:min(46vw,190px);aspect-ratio:1;max-width:100%}
.big-roma{font-size:64px;line-height:1;color:var(--fg);font-weight:400}
.small-roma{font-size:28px;color:var(--muted)}
.pad{width:min(78vw,330px);aspect-ratio:1;max-width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;touch-action:none;position:relative}
.pad svg{width:100%;height:100%;display:block}
.pad.ok{border-color:var(--green)} .pad.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.play{width:68px;height:68px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.play svg{width:28px;height:28px;fill:#fff;margin-inline-start:4px}
.play:active{filter:brightness(.9)}
.actions{display:grid;gap:12px;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));min-height:76px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px))}
.opt{height:min(19vh,128px);border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-size:46px;transition:background .15s,border-color .15s}
.opt.kana{font-size:52px}
.opt:active{background:var(--surface-2)}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.tag{font-size:13px;letter-spacing:.06em;color:var(--blue-soft);background:rgba(90,169,230,.14);padding:5px 12px;border-radius:99px}
.feedback{height:24px;font-size:16px;color:var(--muted);text-align:center}
.feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}

/* done */
.done .stage{gap:14px;text-align:center}
.done h2{font-size:30px;font-weight:400;margin:0}
.score{font-size:64px;color:var(--green);font-variant-numeric:tabular-nums;direction:ltr}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:340px}
.chip{width:58px;height:58px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:32px}

/* chart */
.chart{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start;padding-bottom:24px;direction:ltr}
.cell{aspect-ratio:1;border-radius:14px;background:var(--surface);display:grid;place-items:center;align-content:center;gap:2px;max-width:100%}
.cell .kana{font-size:30px;line-height:1.1}
.cell .roma{font-size:12px;color:var(--muted)}
.cell.new{opacity:.45}
.cell:active{background:var(--surface-2)}
.cell.gap{background:none;pointer-events:none}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.62);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:6px;max-height:88%;overflow-y:auto}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:400}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.switch span{display:grid;gap:2px}
.switch small{color:var(--muted);font-size:13px}
.tgl{width:50px;height:30px;border-radius:99px;background:var(--guide-soft);position:relative;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch[aria-checked="true"] .tgl{background:var(--green)}
.switch[aria-checked="true"] .tgl::after{inset-inline-start:23px}
.credit{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:8px}
.credit a{color:var(--blue-soft)}
.toast{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:30;white-space:nowrap}
.disc.s{background:#e05a4f;border-radius:28%}
.disc .sg-mini{font-family:var(--f-sign);font-size:clamp(28px,8vh,52px);color:#fff;line-height:1}
.home .disc{width:min(40vw,23vh,200px)}
.home{gap:min(22px,2.4vh);overflow-y:auto}
.row.s .badge{background:#e05a4f;border-radius:24px;font-family:var(--f-sign);font-size:30px}
.row.s.locked .badge{background:#7d8494}
.sign{font-family:var(--f-sign);direction:ltr;display:grid;place-items:center;padding:.35em .6em;border-radius:12px;line-height:1.1;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3);border:4px solid rgba(255,255,255,.9);max-width:100%}
.sg-green{background:#1f9d55;color:#fff}.sg-red{background:#d93a3a;color:#fff}.sg-blue{background:#2367b8;color:#fff}
.sg-white{background:#f3f1ea;color:#1c2333;border-color:#1c2333}.sg-yellow{background:#f2c230;color:#1c2333;border-color:#1c2333}.sg-noren{background:#26324a;color:#fff;border-color:#c9a86a}
.word-read{display:grid;justify-items:center;gap:4px;text-align:center}
.word-read .kana{font-size:28px;color:var(--fg)}
.word-read .roma{font-size:18px;color:var(--muted)}
.word-read .he{font-size:30px;color:var(--fg)}
.big-he{font-size:40px;text-align:center;line-height:1.2;text-wrap:balance}
.opt.he{font-size:22px;padding:8px}
.opt.signopt{font-family:var(--f-sign);font-size:32px;direction:ltr}
.chip.w{width:auto;padding-inline:12px;font-family:var(--f-sign);font-size:20px}
.wordgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding-bottom:24px}
.wcell{background:var(--surface);border-radius:14px;padding:12px 8px;display:grid;gap:4px;justify-items:center;min-width:0}
.wcell .sign{font-size:22px;border-width:2px;box-shadow:none;border-radius:8px}
.wcell small{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

  [["禁煙","きんえん","kin'en","אסור לעשן","red"],["立入禁止","たちいりきんし","tachiiri kinshi","הכניסה אסורה","red"],["撮影禁止","さつえいきんし","satsuei kinshi","אסור לצלם","red"],["危険","きけん","kiken","סכנה","yellow"],["注意","ちゅうい","chūi","זהירות","yellow"],["非常口","ひじょうぐち","hijōguchi","יציאת חירום","green"],["案内所","あんないじょ","annaijo","מודיעין","blue"],["交番","こうばん","kōban","עמדת משטרה","white"]]
];
const LESSON_NAME = {s:["בתחנה ובדרך","בחנות ובשירותים","אזהרות ואיסורים"]};
const WORD = {};
ROWS.h = ROWS.h.map(r=>[...r]); ROWS.k = ROWS.k.map(r=>[...r]);
ROWS.s = SIGNS.map(l=>l.map(x=>x[0]));
const ROMA = {}, SCRIPT_OF = {};
SIGNS.flat().forEach(([w,k,r,he,col])=>{ WORD[w]={k,r,he,col}; ROMA[w]=r; SCRIPT_OF[w]="s"; });
for (const s of ["h","k"]) ROWS[s].forEach((row,i)=>{ const r=ROMA_ROWS[i].split(" "); [...row].forEach((c,j)=>{ROMA[c]=r[j]; SCRIPT_OF[c]=s;}); });
const NAME = {h:"הירגנה", k:"קטקנה", s:"שלטים ביפן"};
const DAY = 864e5, INTERVALS = [0, 6e5, 36e5, DAY, 3*DAY, 7*DAY, 21*DAY];

/* ---------- state ---------- */
const KEY = "kana-dojo-v1";
let S = {learned:{}, srs:{}, set:{write:true, sound:true, unlock:false}};
try { const j = JSON.parse(localStorage.getItem(KEY)); if (j) S = {...S, ...j, set:{...S.set, ...(j.set||{})}}; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const $app = document.getElementById("app");
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function glyphSVG(c, {color="#fff", width=6.5, cls="glyph"}={}) {
  const ps = (STROKES[c]||[]).map(d=>`<path d="${d}"/>`).join("");
  return `<svg class="${cls}" viewBox="0 0 109 109" aria-label="${c}"><g fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${ps}</g></svg>`;
}
function signHTML(w, size){
  const W = WORD[w]; const fs = size || Math.min(72, Math.round(250/(w.length+0.6)));
  return `<div class="sign sg-${W.col}" style="font-size:${fs}px">${w}</div>`;
}
const visual = c => SCRIPT_OF[c]==="s" ? signHTML(c) : glyphSVG(c);
const speakText = c => SCRIPT_OF[c]==="s" ? WORD[c].k : c;
const sameAnswer = (a,b) => SCRIPT_OF[a]==="s" ? WORD[a].he===WORD[b].he : ROMA[a]===ROMA[b];
function animateGlyph(svg) {
  if (!svg) return;
  const paths = [...svg.querySelectorAll("path")];
  if (reduced) return;
  let delay = 0;
  paths.forEach(p => {
    const L = p.getTotalLength(); const dur = 180 + L*7;
    p.getAnimations().forEach(a=>a.cancel());
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.animate([{strokeDashoffset:L},{strokeDashoffset:0}], {duration:dur, delay, fill:"forwards", easing:"ease-in-out"});
    delay += dur + 120;
  });
}

let jaVoice = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); jaVoice = v.find(x=>/^ja/i.test(x.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(c) {
  if (!S.set.sound || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speakText(c)); u.lang="ja-JP"; u.rate=.8; if (jaVoice) u.voice=jaVoice; speechSynthesis.speak(u); } catch(e){}
}

/* ---------- SRS ---------- */
function grade(c, ok) {
  const r = S.srs[c] || {b:0, d:0};
  r.b = ok ? Math.min(r.b+1, INTERVALS.length-1) : 0;
  r.d = Date.now() + INTERVALS[r.b];
  S.srs[c] = r; save();
}

/* ---------- session engine ---------- */
let SES = null;
function startLesson(s,i) {
  const chars = [...ROWS[s][i]];
  const q = [];
  const wr = S.set.write && s!=="s";
  chars.forEach(c=>{ q.push({t:"intro",c}); if (wr) q.push({t:"trace",c}); });
  const practice = [];
  chars.forEach(c=>{ practice.push({t:"read",c},{t:"rev",c}); if (wr) practice.push({t:"recall",c}); });
  q.push(...shuffle(practice));
  SES = {s, lesson:i, chars, q, pos:0, total:q.length, graded:0, right:0};
  next();
}
function startReview(s, smart) {
  let pool = learnedChars(s);
  if (!pool.length) { toast("עוד אין תווים שנלמדו כאן"); return; }
  let chars;
  if (smart) {
    const now = Date.now();
    const scored = pool.map(c=>({c, r:S.srs[c]||{b:0,d:0}})).sort((a,b)=> (a.r.d-b.r.d) || (a.r.b-b.r.b));
    const due = scored.filter(x=>x.r.d<=now);
    chars = (due.length ? due : scored).slice(0,10).map(x=>x.c);
  } else chars = shuffle(pool.slice());
  const q = []; const wr = S.set.write && s!=="s";
  chars.forEach(c=>{
    if (smart) { q.push({t:"read",c},{t:"rev",c}); if (wr) q.push({t:"recall",c}); }
    else { const k = ["read","rev"].concat(wr?["recall"]:[]); q.push({t:k[Math.random()*k.length|0], c}); }
  });
  SES = {s, lesson:null, chars, q:shuffle(q), pos:0, total:q.length, graded:0, right:0, review:true};
  next();
}
function next() {
  if (SES.pos >= SES.q.length) return Done();
  const it = SES.q[SES.pos++];
  ({intro:Intro, trace:Write, recall:Write, read:Read, rev:Read})[it.t](it);
}
function requeue(it){ SES.q.push({...it, again:true}); SES.total++; }
function result(it, ok){
  if (!it.again) { SES.graded++; if (ok) SES.right++; grade(it.c, ok); }
  if (!ok) requeue(it);
}
function sessionShell(prompt) {
  const el = h(`<section class="screen">
    <div class="bar">
      <button class="icon-btn" data-a="x" aria-label="יציאה">${ICON.x}</button>
      <div class="progress" aria-hidden="true"><i></i></div>
      <button class="icon-btn" data-a="set" aria-label="הגדרות">${ICON.gear}</button>
    </div>
    <p class="prompt">${prompt}</p>
    <div class="stage"></div>
  </section>`);
  const done = Math.max(0, SES.pos-1);
  requestAnimationFrame(()=>{ el.querySelector(".progress i").style.width = Math.max(4, done/SES.total*100)+"%"; });
  el.querySelector('[data-a="x"]').onclick = ()=>List(SES.s);
  el.querySelector('[data-a="set"]').onclick = ()=>Settings(()=>{});
  return el;
}

function wordInfo(w){ const W=WORD[w]; return `<div class="word-read"><span class="he">${W.he}</span><span class="kana">${W.k}</span><span class="roma">${W.r}</span></div>`; }
function Intro(it) {
  const el = sessionShell(SCRIPT_OF[it.c]==="s" ? "שלט חדש" : "תו חדש");
  const st = el.querySelector(".stage");
  st.innerHTML = `${visual(it.c)}${SCRIPT_OF[it.c]==="s" ? wordInfo(it.c) : `<div class="big-roma roma">${ROMA[it.c]}</div>`}<button class="play" aria-label="השמעה והדגמה">${ICON.play}</button>`;
  el.appendChild(h(`<div class="actions"><button class="btn green">הבנתי</button></div>`));
  const go = ()=>{ animateGlyph(st.querySelector(".glyph")); speak(it.c); };
  st.querySelector(".play").onclick = go;
  el.querySelector(".btn").onclick = next;
  show(el); go();
}

function Read(it) {
  const rev = it.t==="rev";
  const isS = SCRIPT_OF[it.c]==="s";
  const el = sessionShell(isS ? (rev ? "איזה שלט אומר..." : "מה כתוב בשלט?") : (rev ? "איזה תו זה?" : "איך קוראים את זה?"));
  const st = el.querySelector(".stage");
  st.innerHTML = isS ? (rev ? `<div class="big-he">${WORD[it.c].he}</div>` : signHTML(it.c)) : (rev ? `<div class="big-roma roma">${ROMA[it.c]}</div>` : glyphSVG(it.c));
  // distractors: same script, prefer lesson/learned chars, unique romaji
  const s = SCRIPT_OF[it.c];
  const near = new Set([...(SES.chars||[]), ...learnedChars(s)]);
  let pool = shuffle([...near].filter(c=>c!==it.c && !sameAnswer(c,it.c)));
  const all = shuffle(ROWS[s].flat().filter(c=>c!==it.c && !sameAnswer(c,it.c)));
  const opts = [it.c];
  for (const c of pool.concat(all)) { if (opts.length===4) break; if (!opts.some(o=>sameAnswer(o,c))) opts.push(c); }
  shuffle(opts);
  const box = h(`<div class="opts"></div>`);
  let locked = false;
  opts.forEach(c=>{
    const b = isS
      ? h(`<button class="opt ${rev?"signopt":"he"}">${rev ? c : WORD[c].he}</button>`)
      : h(`<button class="opt ${rev?"kana":"roma"}">${rev ? c : ROMA[c]}</button>`);
    b.onclick = ()=>{
      if (locked) return; locked = true;
      const ok = c===it.c;
      b.classList.add(ok?"right":"wrong");
      if (!ok) [...box.children][opts.indexOf(it.c)].classList.add("right");
      speak(it.c); result(it, ok);
      setTimeout(next, ok ? 650 : 1500);
    };
    box.appendChild(b);
  });
  el.appendChild(box);
  show(el);
}

function Write(it) {
  const trace = it.t==="trace";
  const el = sessionShell(trace ? "כתבו את התו לפי הסדר" : "איך כותבים את...");
  const st = el.querySelector(".stage");
  st.innerHTML = `<div class="${trace?"small-roma":"big-roma"} roma">${ROMA[it.c]}</div><div class="pad"></div><div class="feedback" aria-live="polite"></div><button class="play" aria-label="השמעה">${ICON.play}</button>`;
  const actions = h(`<div class="actions">${trace?"":`<button class="btn orange" data-a="hint">רמז</button>`}</div>`);
  el.appendChild(actions);
  const fb = st.querySelector(".feedback");
  const pad = new Pad(st.querySelector(".pad"), it.c, trace, (mistakes, hinted)=>{
    const ok = trace || (mistakes < 2 && !hinted);
    fb.className = "feedback " + (ok ? "good" : "bad");
    fb.textContent = ok ? "מעולה" : "נחזור על זה שוב בהמשך";
    speak(it.c);
    if (!trace) result(it, ok);
    setTimeout(next, ok ? 750 : 1300);
  }, (msg, good)=>{ fb.className = "feedback " + (good?"good":"bad"); fb.textContent = msg; });
  st.querySelector(".play").onclick = ()=>speak(it.c);
  const hb = actions.querySelector('[data-a="hint"]');
  if (hb) hb.onclick = ()=>pad.hint();
  show(el);
  pad.init();
}

/* ---------- writing pad ---------- */
const NS = "http://www.w3.org/2000/svg";
class Pad {
  constructor(host, c, trace, onDone, onMsg) {
    Object.assign(this, {host, c, trace, onDone, onMsg, k:0, mistakes:0, fails:0, hinted:false, pts:null});
    this.d = STROKES[c];
    host.innerHTML = `<svg viewBox="0 0 109 109">
      <g class="guide" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
      <g class="done" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></g>
      <g class="dots"></g>
      <polyline class="live" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
    this.svg = host.firstElementChild;
    this.gGuide = this.svg.querySelector(".guide"); this.gDone = this.svg.querySelector(".done");
    this.gDots = this.svg.querySelector(".dots"); this.live = this.svg.querySelector(".live");
  }
  init() {
    this.guides = this.d.map(d=>{ const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); p.setAttribute("stroke-width","9"); this.gGuide.appendChild(p); return p; });
    this.ref = this.guides.map(p=>{ const L=p.getTotalLength(); return {L, pts:Array.from({length:24},(_,i)=>{const q=p.getPointAtLength(L*i/23); return [q.x,q.y];})}; });
    this.paint();
    const sv = this.svg;
    sv.addEventListener("pointerdown", e=>{ if (this.k>=this.d.length) return; sv.setPointerCapture(e.pointerId); this.pts=[this.xy(e)]; this.drawLive(); e.preventDefault(); });
    sv.addEventListener("pointermove", e=>{ if (!this.pts) return; (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>this.pts.push(this.xy(ev))); this.drawLive(); });
    const end = ()=>{ if (!this.pts) return; const p=this.pts; this.pts=null; this.check(p); };
    sv.addEventListener("pointerup", end); sv.addEventListener("pointercancel", end);
  }
  xy(e){ const m=this.svg.getScreenCTM().inverse(); const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m); return [p.x,p.y]; }
  drawLive(){ this.live.setAttribute("points", (this.pts||[]).map(p=>p.join(",")).join(" ")); this.live.style.opacity=1; }
  showStroke(i){ return this.trace || this.hintUpTo >= i; }
  paint() {
    // guide: in trace mode every stroke visible, current one brighter; in recall mode only hinted stroke
    this.guides.forEach((p,i)=>{
      let col = "transparent";
      if (i>=this.k) {
        if (this.trace) col = i===this.k ? "var(--guide)" : "var(--guide-soft)";
        else if (this.hintUpTo===this.k && i===this.k) col = "var(--guide)";
      }
      p.setAttribute("stroke", col);
    });
    this.gDots.innerHTML = "";
    const showDots = this.k < this.d.length && (this.trace || this.hintUpTo===this.k);
    if (showDots) {
      const r = this.ref[this.k].pts;
      this.gDots.innerHTML = `<circle cx="${r[0][0]}" cy="${r[0][1]}" r="3.2" fill="var(--green)"/><circle cx="${r[23][0]}" cy="${r[23][1]}" r="3.2" fill="var(--red)"/>`;
    }
  }
  hint() {
    if (this.k>=this.d.length) return;
    this.hinted = true; this.hintUpTo = this.k; this.paint();
    const p = this.guides[this.k]; const L = this.ref[this.k].L;
    if (!reduced) p.animate([{strokeDasharray:`${L} ${L}`, strokeDashoffset:L},{strokeDasharray:`${L} ${L}`, strokeDashoffset:0}], {duration:200+L*7, easing:"ease-in-out"});
  }
  resample(pts, n) {
    const out=[]; const seg=[0];
    for (let i=1;i<pts.length;i++) seg.push(seg[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    const L = seg[seg.length-1];
    for (let i=0;i<n;i++){
      const t = L*i/(n-1); let j=1; while (j<seg.length-1 && seg[j]<t) j++;
      const a=pts[j-1], b=pts[j]||a, s0=seg[j-1], s1=seg[j]??s0, f = s1>s0 ? (t-s0)/(s1-s0) : 0;
      out.push([a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]);
    }
    return {pts:out, L};
  }
  check(raw) {
    const ref = this.ref[this.k];
    const u = this.resample(raw.length>1?raw:[raw[0],raw[0]], 24);
    const dist = (a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
    let mean = 0; for (let i=0;i<24;i++) mean += dist(u.pts[i], ref.pts[i]); mean/=24;
    const short = ref.L < 14;
    const ok = short
      ? (mean < 15 && dist(u.pts[0],ref.pts[0]) < 18 && u.L < 40)
      : (mean < 13 && dist(u.pts[0],ref.pts[0]) < 19 && dist(u.pts[23],ref.pts[23]) < 22 && u.L > ref.L*0.45);
    if (ok) {
      const p = document.createElementNS(NS,"path"); p.setAttribute("d", this.d[this.k]); this.gDone.appendChild(p);
      this.live.style.opacity = 0; this.k++; this.fails = 0; this.onMsg("");
      this.paint();
      if (this.k >= this.d.length) { this.host.classList.add("ok"); this.onDone(this.mistakes, this.hinted); }
    } else {
      this.mistakes++; this.fails++;
      this.live.setAttribute("stroke","var(--red)");
      this.host.classList.remove("bad"); void this.host.offsetWidth; this.host.classList.add("bad");
      const start = dist(u.pts[0],ref.pts[0]) >= 19, rev = dist(u.pts[0],ref.pts[23]) < 15 && dist(u.pts[23],ref.pts[0]) < 15;
      this.onMsg(rev ? "כיוון הפוך, מתחילים מהנקודה הירוקה" : start ? `משיכה ${this.k+1}: נקודת ההתחלה לא נכונה` : `משיכה ${this.k+1}: נסו שוב`);
      setTimeout(()=>{ this.live.style.opacity=0; this.live.setAttribute("stroke","#fff"); }, 350);
      if (!this.trace && this.fails >= 2 && this.hintUpTo !== this.k) this.hint();
    }
  }
}

function Done() {
  const pct = SES.graded ? Math.round(SES.right/SES.graded*100) : 100;
  if (SES.lesson !== null) { S.learned[lessonId(SES.s, SES.lesson)] = true; save(); }
  const hasNext = SES.lesson !== null && SES.lesson < ROWS[SES.s].length-1;
  const el = h(`<section class="screen done">
    <div class="stage">
      <h2>${SES.review ? "החזרה הושלמה" : `שיעור ${SES.lesson+1} הושלם`}</h2>
      <div class="score">${pct}%</div>
      <div class="small-roma" style="font-size:16px">דיוק בניסיון הראשון</div>
      <div class="chips">${SES.chars.slice(0,15).map(c=>`<span class="chip kana ${SCRIPT_OF[c]==="s"?"w":""}">${c}</span>`).join("")}</div>
    </div>
    <div class="actions">
      ${hasNext ? `<button class="btn blue" data-a="next">לשיעור הבא</button>` : ""}
      <button class="btn ghost" data-a="list">חזרה לרשימה</button>
    </div>
  </section>`);
  el.querySelector('[data-a="list"]').onclick = ()=>List(SES.s);
  el.querySelector('[data-a="next"]')?.addEventListener("click", ()=>startLesson(SES.s, SES.lesson+1));
  show(el);
}

Home();
</script>
